<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>plugin-marketplace — Repository</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-hover: #1a1a1a;
      --border: #2a2a2a;
      --text: #e5e5e5;
      --text-secondary: #888;
      --text-tertiary: #555;
      --accent: #c084fc;
      --accent-dim: #7c3aed;
      --blue: #60a5fa;
      --green: #4ade80;
      --orange: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .top-nav {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .top-nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.15s;
    }

    .top-nav a:hover { color: var(--text); }
    .top-nav a.active { color: var(--accent); }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
    }

    .breadcrumb a {
      color: var(--blue);
      text-decoration: none;
    }

    .breadcrumb a:hover { text-decoration: underline; }

    .breadcrumb .sep {
      color: var(--text-tertiary);
    }

    .breadcrumb .current {
      color: var(--text-secondary);
    }

    /* Repo header — like GitHub's repo bar */
    .repo-header {
      border: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      background: var(--surface);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .repo-icon {
      font-size: 1.3rem;
    }

    .repo-name {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--blue);
    }

    .repo-name span {
      color: var(--text-secondary);
      font-weight: 400;
    }

    .repo-badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      background: var(--border);
      color: var(--text-secondary);
      margin-left: 0.5rem;
    }

    .repo-header-actions {
      margin-left: auto;
      display: flex;
      gap: 0.5rem;
    }

    .repo-header-actions a {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.75rem;
      transition: all 0.15s;
    }

    .repo-header-actions a:hover {
      border-color: var(--accent-dim);
      color: var(--text);
    }

    /* Clone note */
    .repo-clone-note {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: none;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .repo-clone-note .clone-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .repo-clone-note code {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.35rem 0.75rem;
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      font-size: 0.78rem;
      color: var(--green);
      user-select: all;
      word-break: break-all;
    }

    .repo-clone-note .copy-btn {
      font-size: 0.75rem;
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }

    .repo-clone-note .copy-btn:hover {
      border-color: var(--accent-dim);
      color: var(--text);
    }

    /* File list */
    .file-list {
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      background: var(--surface);
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1.25rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
      cursor: default;
      transition: background 0.1s;
    }

    .file-row:last-child {
      border-bottom: none;
      border-radius: 0 0 8px 8px;
    }

    .file-row:hover {
      background: var(--surface-hover);
    }

    .file-row.folder {
      cursor: pointer;
      user-select: none;
    }

    .file-icon {
      width: 18px;
      text-align: center;
      flex-shrink: 0;
      font-size: 0.9rem;
    }

    .file-icon.folder-icon { color: var(--blue); }
    .file-icon.file-icon-color { color: var(--text-tertiary); }
    .file-icon.markdown-icon { color: var(--accent); }
    .file-icon.json-icon { color: var(--orange); }
    .file-icon.external-icon { color: var(--blue); }

    /* External plugin row: badge + source link rendered inline */
    .badge-external {
      display: inline-block;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: rgba(96, 165, 250, 0.15);
      color: var(--blue);
      padding: 0.05rem 0.4rem;
      border-radius: 3px;
      margin-left: 0.4rem;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .ext-source {
      font-size: 0.72rem;
      color: var(--text-secondary);
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 50%;
    }

    .ext-source a {
      color: var(--blue);
      text-decoration: none;
    }

    .ext-source a:hover { text-decoration: underline; }

    .ext-source code {
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      font-size: 0.68rem;
      color: var(--text);
      background: var(--bg);
      padding: 0.05rem 0.35rem;
      border-radius: 3px;
    }

    .file-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-name.folder-name { color: var(--blue); }

    .file-meta {
      font-size: 0.72rem;
      color: var(--text-tertiary);
      flex-shrink: 0;
    }

    .file-children {
      display: none;
    }

    .file-children.open {
      display: block;
    }

    .file-children .file-row {
      padding-left: 2.5rem;
    }

    .file-children .file-children .file-row {
      padding-left: 3.75rem;
    }

    .file-children
      .file-children
      .file-children
      .file-row {
      padding-left: 5rem;
    }

    .toggle-arrow {
      width: 12px;
      font-size: 0.65rem;
      color: var(--text-tertiary);
      transition: transform 0.15s;
      flex-shrink: 0;
      text-align: center;
    }

    .file-row.open .toggle-arrow {
      transform: rotate(90deg);
    }

    /* Summary bar */
    .repo-summary {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .repo-summary strong {
      color: var(--text);
    }

    /* Footer */
    .back-link {
      display: inline-block;
      margin-top: 2rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-link:hover { text-decoration: underline; }

    footer {
      text-align: center;
      padding: 2rem 0;
      margin-top: 2rem;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      .repo-header {
        flex-wrap: wrap;
      }
      .repo-header-actions {
        margin-left: 0;
        margin-top: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <a href="index.html">Marketplace</a>
      <a href="repo.html" class="active">Repository</a>
      <a href="admin.html">Admin</a>
    </nav>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
      <a href="index.html">Plugin Marketplace</a>
      <span class="sep">/</span>
      <span class="current">plugin-marketplace</span>
    </div>

    <!-- Repo header -->
    <div class="repo-header">
      <span class="repo-icon">📦</span>
      <span class="repo-name">plugin-marketplace</span>
      <span class="repo-badge">Public</span>
      <div class="repo-header-actions">
        <a href="index.html">← Marketplace</a>
      </div>
    </div>

    <div class="repo-clone-note">
      <span class="clone-label">Clone or add this marketplace:</span>
      <code id="clone-url">http://localhost:8081/droid/v1/marketplace.git</code>
      <button class="copy-btn" onclick="copyCloneUrl()">Copy</button>
    </div>

    <div class="file-list" id="file-list"></div>

    <div class="repo-summary" id="repo-summary"></div>

    <footer>
      <p>
        Built for <a href="https://code.claude.com/docs/en/plugin-marketplaces" target="_blank">Claude Code Plugin Marketplace</a>
      </p>
    </footer>
  </div>

  <script>
    // File tree — mirrors the git repo structure, filtered by admin enabled state
    const PLUGIN_DIRS = [
      { name: "code-review", type: "dir", children: [
        { name: ".claude-plugin", type: "dir", children: [
          { name: "plugin.json", type: "file", ext: "json" }
        ]},
        { name: "skills", type: "dir", children: [
          { name: "code-review", type: "dir", children: [
            { name: "SKILL.md", type: "file", ext: "md" }
          ]}
        ]}
      ]},
      { name: "doc-generator", type: "dir", children: [
        { name: ".claude-plugin", type: "dir", children: [
          { name: "plugin.json", type: "file", ext: "json" }
        ]},
        { name: "skills", type: "dir", children: [
          { name: "doc-generator", type: "dir", children: [
            { name: "SKILL.md", type: "file", ext: "md" }
          ]}
        ]}
      ]},
      { name: "git-companion", type: "dir", children: [
        { name: ".claude-plugin", type: "dir", children: [
          { name: "plugin.json", type: "file", ext: "json" }
        ]},
        { name: "skills", type: "dir", children: [
          { name: "branch-naming", type: "dir", children: [
            { name: "SKILL.md", type: "file", ext: "md" }
          ]},
          { name: "commit-message", type: "dir", children: [
            { name: "SKILL.md", type: "file", ext: "md" }
          ]}
        ]}
      ]},
      { name: "refactor-helper", type: "dir", children: [
        { name: ".claude-plugin", type: "dir", children: [
          { name: "plugin.json", type: "file", ext: "json" }
        ]},
        { name: "skills", type: "dir", children: [
          { name: "refactor-helper", type: "dir", children: [
            { name: "SKILL.md", type: "file", ext: "md" }
          ]}
        ]}
      ]},
      { name: "test-scaffold", type: "dir", children: [
        { name: ".claude-plugin", type: "dir", children: [
          { name: "plugin.json", type: "file", ext: "json" }
        ]},
        { name: "skills", type: "dir", children: [
          { name: "test-scaffold", type: "dir", children: [
            { name: "SKILL.md", type: "file", ext: "md" }
          ]}
        ]}
      ]}
    ];

    // Visibility in the Git repository view follows the same rules used by
    // admin.html and index.html:
    //   - Built-in plugins: visible when Enabled AND Git toggle both on.
    //   - External plugins: visible when Enabled is on. The Git toggle is
    //     N/A for externals (they're not in the local bare repo at all),
    //     so we ignore it for them, matching admin.html which renders the
    //     Git column as a dash for external rows.
    const STORAGE_KEYS = {
      enabled:  "plugin-marketplace-enabled",
      git:      "plugin-marketplace-git"
    };

    function readNames(key) {
      try {
        const raw = localStorage.getItem(key);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return null;
    }

    // Cache of external plugins loaded from the server's ingest service.
    let externalsCache = [];

    async function fetchExternals() {
      try {
        const r = await fetch("/api/external", { cache: "no-store" });
        if (r.ok) {
          const data = await r.json();
          if (Array.isArray(data.externals)) {
            externalsCache = data.externals;
            return externalsCache;
          }
        }
      } catch (e) {
        console.warn("Could not fetch /api/external, falling back to localStorage:", e);
      }
      try {
        const raw = localStorage.getItem("plugin-marketplace-external");
        if (raw) {
          externalsCache = JSON.parse(raw) || [];
          return externalsCache;
        }
      } catch (e) {}
      externalsCache = [];
      return externalsCache;
    }

    function externalKey(p) {
      return `github:${p.repo}:${p.path || ""}`;
    }

    function buildTree() {
      const enabled = readNames(STORAGE_KEYS.enabled);
      const git     = readNames(STORAGE_KEYS.git);
      const externals = externalsCache;

      const builtinVisible = (p) =>
        (enabled === null || enabled.includes(p.name)) &&
        (git     === null || git.includes(p.name));
      const externalVisible = (p) => {
        const k = externalKey(p);
        return enabled === null || enabled.includes(k);
      };

      const filteredBuiltins  = PLUGIN_DIRS.filter(builtinVisible);
      // Externals are downloaded into the marketplace repo, so they show
      // up as real plugin folders alongside built-ins. Their file tree is
      // captured by the ingest service and returned in the registry, so
      // we render them as expandable directories adorned with an
      // External badge + commit chip on the folder header row.
      const filteredExternals = externals
        .filter(externalVisible)
        .map(p => ({
          name: p.name,
          // If the registry includes the captured tree (added by the
          // ingest service), render as a fully browseable folder. Older
          // registry entries without `tree` fall back to a leaf node.
          type: Array.isArray(p.tree) && p.tree.length ? "external-dir" : "external",
          repo: p.repo,
          path: p.path || "",
          ref:  p.ref,
          commit: p.commit,
          url:  p.url,
          children: Array.isArray(p.tree) ? p.tree : []
        }));

      return [
        { name: ".claude-plugin", type: "dir", children: [
          { name: "marketplace.json", type: "file", ext: "json" }
        ]},
        { name: ".factory-plugin", type: "dir", children: [
          { name: "marketplace.json", type: "file", ext: "json" }
        ]},
        { name: "plugins", type: "dir", children: [...filteredBuiltins, ...filteredExternals] },
        { name: "Dockerfile", type: "file", ext: "" },
        { name: "Makefile", type: "file", ext: "" },
        { name: "admin.html", type: "file", ext: "html" },
        { name: "index.html", type: "file", ext: "html" },
        { name: "nginx.conf", type: "file", ext: "conf" },
        { name: "repo.html", type: "file", ext: "html" },
        { name: "start.sh", type: "file", ext: "sh" }
      ];
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
      })[c]);
    }

    function iconFor(node) {
      if (node.type === "dir") return "📁";
      if (node.type === "external" || node.type === "external-dir") return "🔗";
      const ext = node.ext || "";
      switch (ext) {
        case "md": return "📝";
        case "json": return "⚙️";
        case "sh": return "🐚";
        case "html": return "🌐";
        case "conf": return "🔧";
        default: return "📄";
      }
    }

    function iconClassFor(node) {
      if (node.type === "dir") return "folder-icon";
      if (node.type === "external" || node.type === "external-dir") return "external-icon";
      switch (node.ext) {
        case "md": return "markdown-icon";
        case "json": return "json-icon";
        default: return "file-icon-color";
      }
    }

    function countItems(tree) {
      let dirs = 0, files = 0, externals = 0;
      function walk(nodes) {
        for (const n of nodes) {
          if (n.type === "dir") { dirs++; walk(n.children || []); }
          else if (n.type === "external-dir") {
            // External plugins downloaded into the repo are folders; their
            // contents count towards dirs/files like any other folder, but
            // we also keep an `externals` tally for the summary bar.
            externals++; dirs++; walk(n.children || []);
          }
          else if (n.type === "external") externals++;
          else files++;
        }
      }
      walk(tree);
      return { dirs, files, externals };
    }

    function renderTree(nodes, level) {
      return nodes.map(n => {
        if (n.type === "dir") {
          const id = "dir-" + Math.random().toString(36).slice(2, 8);
          return `
            <div class="file-row folder" data-dir-id="${id}" onclick="toggleDir('${id}')">
              <span class="toggle-arrow">▶</span>
              <span class="file-icon ${iconClassFor(n)}">${iconFor(n)}</span>
              <span class="file-name folder-name">${escapeHtml(n.name)}</span>
            </div>
            <div class="file-children" id="${id}">
              ${renderTree(n.children || [], level + 1)}
            </div>
          `;
        }
        if (n.type === "external-dir") {
          // External plugin that was downloaded into the marketplace repo.
          // Render as a regular expandable folder, but adorn the header row
          // with the External badge + GitHub source link + commit chip so
          // its provenance stays obvious.
          const id = "dir-" + Math.random().toString(36).slice(2, 8);
          const shortSha = (n.commit || "").slice(0, 7);
          const repoPath = n.path ? `${n.repo}/${n.path}` : n.repo;
          return `
            <div class="file-row folder" data-dir-id="${id}" onclick="toggleDir('${id}')">
              <span class="toggle-arrow">▶</span>
              <span class="file-icon folder-icon">📁</span>
              <span class="file-name folder-name">${escapeHtml(n.name)}</span>
              <span class="badge-external">External</span>
              <span class="ext-source">
                <a href="${escapeHtml(n.url)}" target="_blank" rel="noopener" title="Open source on GitHub" onclick="event.stopPropagation()">${escapeHtml(repoPath)}</a>
                <code title="Pinned commit">${escapeHtml(shortSha)}</code>
              </span>
            </div>
            <div class="file-children" id="${id}">
              ${renderTree(n.children || [], level + 1)}
            </div>
          `;
        }
        if (n.type === "external") {
          // Legacy: registry entry without a captured tree (e.g. one added
          // before this feature shipped). Render as a leaf with the source
          // link only.
          const shortSha = (n.commit || "").slice(0, 7);
          const repoPath = n.path ? `${n.repo}/${n.path}` : n.repo;
          return `
            <div class="file-row">
              <span class="toggle-arrow" style="visibility:hidden">▶</span>
              <span class="file-icon ${iconClassFor(n)}">${iconFor(n)}</span>
              <span class="file-name">${escapeHtml(n.name)}</span>
              <span class="badge-external">External</span>
              <span class="ext-source">
                <a href="${escapeHtml(n.url)}" target="_blank" rel="noopener" title="Open source on GitHub">${escapeHtml(repoPath)}</a>
                <code title="Pinned commit">${escapeHtml(shortSha)}</code>
              </span>
            </div>
          `;
        }
        return `
          <div class="file-row">
            <span class="toggle-arrow" style="visibility:hidden">▶</span>
            <span class="file-icon ${iconClassFor(n)}">${iconFor(n)}</span>
            <span class="file-name">${escapeHtml(n.name)}</span>
          </div>
        `;
      }).join("");
    }

    function toggleDir(id) {
      const children = document.getElementById(id);
      const row = document.querySelector(`[data-dir-id="${id}"]`);
      if (!children || !row) return;
      children.classList.toggle("open");
      row.classList.toggle("open");
    }

    // Set clone URL to match actual host
    const cloneUrl = window.location.origin + "/droid/v1/marketplace.git";
    const cloneEl = document.getElementById("clone-url");
    if (cloneEl) cloneEl.textContent = cloneUrl;

    window.copyCloneUrl = function() {
      const el = document.getElementById("clone-url");
      if (!el) return;
      navigator.clipboard.writeText(el.textContent).catch(() => {
        // Fallback for older browsers / non-secure contexts
        const ta = document.createElement("textarea");
        ta.value = el.textContent;
        ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      });
    };

    // Render the tree. Wrapped in a function so it can be re-invoked when
    // state changes (e.g., after adding an external plugin in admin.html
    // in another tab, or returning to this tab).
    async function renderAll() {
      await fetchExternals();
      const tree = buildTree();
      document.getElementById("file-list").innerHTML = renderTree(tree, 0);
      const { dirs, files, externals } = countItems(tree);
      const extPart = externals ? ` · <strong>${externals}</strong> external` : "";
      document.getElementById("repo-summary").innerHTML =
        `<strong>${dirs}</strong> directories · <strong>${files}</strong> files${extPart}`;
    }

    renderAll();

    // Re-render when admin changes the marketplace state. The 'storage' event
    // fires for changes made in *other* tabs; we also re-render on focus so
    // changes made in this tab via /admin (same-tab nav back) are picked up,
    // and the server-side external registry is re-fetched each time.
    window.addEventListener("storage", (e) => {
      if (!e.key || e.key.startsWith("plugin-marketplace-")) renderAll();
    });
    window.addEventListener("focus", renderAll);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) renderAll();
    });
  </script>
</body>
</html>
