worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # --- Droid CLI git endpoint ---
        location ~ ^/droid/v1/marketplace\.git {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
            fastcgi_param GIT_HTTP_EXPORT_ALL "";
            fastcgi_param GIT_PROJECT_ROOT /var/lib/git;
            fastcgi_param PATH_INFO $uri;
            fastcgi_pass unix:/var/run/fcgiwrap.socket;
        }

        # --- External plugin ingest API (proxied to local Python service) ---
        location /api/external {
            proxy_pass         http://127.0.0.1:8089;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Ingest may need to download from GitHub: give it room to work.
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            client_max_body_size 1m;
        }

        # Allow dot-directories needed by Claude Code and Droid
        location ~ /\.(claude-plugin|factory-plugin)/ {
            # nginx serves these by default when root is set; explicitly allow
        }

        # --- Static marketplace site (default) ---
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
